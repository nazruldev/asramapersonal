name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Vite membekukan VITE_* saat build — wajib diisi di GitHub Secrets,
      # kalau kosong APK/OTA/Electron tidak bisa sambung Turso.
      - name: Build web bundle
        env:
          VITE_TURSO_DATABASE_URL: ${{ secrets.VITE_TURSO_DATABASE_URL }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN }}
          VITE_ABLY_API_KEY: ${{ secrets.VITE_ABLY_API_KEY }}
        run: |
          if [ -z "$VITE_TURSO_DATABASE_URL" ] || [ -z "$VITE_TURSO_AUTH_TOKEN" ]; then
            echo "::error::Secret VITE_TURSO_DATABASE_URL / VITE_TURSO_AUTH_TOKEN kosong. Isi di Settings → Secrets."
            exit 1
          fi
          npm run build
        shell: bash

      # WAJIB pakai Capgo CLI — Compress-Archive/PowerShell menghasilkan zip
      # dengan EXT descriptor yang gagal di-unzip Java/Android (Capgo known issue).
      # --name harus dist.zip (bukan "dist") karena folder ./dist sudah ada di repo.
      - name: Zip OTA bundle (Capgo CLI)
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          npx @capgo/cli@latest bundle zip com.asramapersonal.app --path web/dist --name dist.zip --bundle "$VER"

      # Build installer Electron TANPA publish (upload digabung di step bawah)
      - name: Build Electron installer
        env:
          VITE_TURSO_DATABASE_URL: ${{ secrets.VITE_TURSO_DATABASE_URL }}
          VITE_TURSO_AUTH_TOKEN: ${{ secrets.VITE_TURSO_AUTH_TOKEN }}
          VITE_ABLY_API_KEY: ${{ secrets.VITE_ABLY_API_KEY }}
        run: npm run build && npx electron-builder --win --publish never

      # Satu step upload semua asset: dist.zip (OTA Android) + installer + latest.yml (auto-update Electron)
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist.zip
            release/*.exe
            release/*.blockmap
            release/latest.yml
